name: PvZ upstream sync and release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pvz-upstream-sync-release.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Publish current upstream snapshot even if no new commits'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pvz-upstream-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: DreamMoonCai/Pvz2Tool
  UPSTREAM_BRANCH: main
  BUILD_KIND: android

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      commit: ${{ steps.merge.outputs.commit }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch and merge upstream safely
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          upstream_sha="$(git rev-parse FETCH_HEAD)"
          printf 'upstream_sha=%s\n' "$upstream_sha" >> "$GITHUB_OUTPUT"
          incoming="$(git rev-list --count HEAD..FETCH_HEAD)"
          echo "Upstream-only commits: $incoming" >> "$GITHUB_STEP_SUMMARY"
          if [ "$incoming" -gt 0 ]; then
            # Keep fork-owned Actions definitions; GITHUB_TOKEN cannot write workflows.
            git merge --no-ff --no-commit FETCH_HEAD
            git restore --source=HEAD --staged --worktree -- .github/workflows
            git commit -m "chore(sync): import upstream $upstream_sha preserving fork workflows"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force_release == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        if: env.BUILD_KIND == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        if: env.BUILD_KIND == 'dotnet'
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Try to build suitable distributable
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          case "$BUILD_KIND" in
            python)
              python -m pip install --upgrade build
              python -m build --outdir release-files
              ;;
            dotnet)
              proj="$(find . -name '*.csproj' -not -path '*/obj/*' | head -n 1)"
              test -n "$proj"
              if [ -f PopStudio.ConsoleProject/PopStudio.ConsoleProject.csproj ]; then
                proj=PopStudio.ConsoleProject/PopStudio.ConsoleProject.csproj
              fi
              dotnet publish "$proj" -c Release -o "$RUNNER_TEMP/pvz-dotnet"
              python -m zipfile -c release-files/dotnet-publish.zip "$RUNNER_TEMP/pvz-dotnet"
              ;;
            android)
              # CI-only fallback to the nearest published versions in Maven Central.
              # Keep the original version catalog in the upstream source archive.
              python3 - <<'PY'
          from pathlib import Path
          p = Path("gradle/libs.versions.toml")
          s = p.read_text(encoding="utf-8")
          for old, new in [
              ('android-floatingx = "2.3.8"', 'android-floatingx = "2.3.7"'),
              ('module = "io.github.alexzhirkevich:keight", version = "0.0.08"', 'module = "io.github.alexzhirkevich:keight", version = "0.0.07"'),
          ]:
              if s.count(old) != 1:
                  raise SystemExit(f"Dependency catalog changed; review fallback: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY
              git diff -- gradle/libs.versions.toml > release-files/Pvz2Tool-ci-dependencies.patch
              chmod +x gradlew
              ./gradlew :composeApp:assembleDebug --no-daemon --no-configuration-cache
              find composeApp -path '*/build/outputs/apk/*' -name '*.apk' -exec cp '{}' release-files/ \;
              test -n "$(find release-files -name '*.apk' -print -quit)"
              ;;
            rust)
              cargo build --release --locked
              cp target/release/pvz-bintools.exe release-files/
              ;;
            cpp)
              cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
              cmake --build build --config Release --parallel
              find build -type f -iname '*.exe' -not -path '*/CMakeFiles/*' -exec cp '{}' release-files/ \;
              test -n "$(find release-files -name '*.exe' -print -quit)"
              ;;
            source)
              python -m compileall -q Resource_Tool Player_Tool
              ;;
            *)
              echo "Unknown build kind: $BUILD_KIND" >&2
              exit 1
              ;;
          esac
      - name: Release only when upstream changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ needs.sync.outputs.commit }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          tag="upstream-${UPSTREAM_SHA:0:12}"
          archive_sha="$MERGED_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag"
            archive_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
            git merge-base --is-ancestor "$UPSTREAM_SHA" "$archive_sha"
            git merge-base --is-ancestor "$archive_sha" "$MERGED_SHA"
            # Existing source archive remains tied to its original immutable tag.
          fi
          git archive --format=zip --output="release-files/Pvz2Tool-source.zip" "$archive_sha"
          if [[ "$BUILD_OUTCOME" != success ]]; then
            find release-files -maxdepth 1 -name '*.apk' -delete
          fi
          notes="Source: https://github.com/$UPSTREAM_REPO/commit/$UPSTREAM_SHA
          Merged commit: $MERGED_SHA
          Source archive commit: $archive_sha
          Latest build attempt: $BUILD_OUTCOME
          Android CI dependency fallback: FloatingX 2.3.7 and Keight 0.0.07 (see attached patch when present).
          The source ZIP is unmodified; newly built APKs are attached only after a successful build. Existing APK assets from a prior successful build, if any, are retained."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" release-files/* --target "$MERGED_SHA" --title "Pvz2Tool upstream ${UPSTREAM_SHA:0:12}" --notes "$notes"
          fi
          echo "Release: $tag ($BUILD_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BUILD_KIND" == android && "$BUILD_OUTCOME" != success ]]; then
            echo "::error::APK build failed; source-only release is not a successful binary build."
            exit 1
          fi
